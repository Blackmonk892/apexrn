name: ci

on:
  push:
    branches: [main, 'ship/**']
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    # Linux on purpose: catches filename-case bugs that Windows/macOS hide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npm run doctor
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npm test -- --ci
        working-directory: demo
      - run: npx expo export --platform web
        working-directory: demo

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
        working-directory: preview
      - run: npm run doctor
        working-directory: preview
      - run: npm run typecheck
        working-directory: preview
      - run: npm run build:web
        working-directory: preview

  website:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://blackmonk892.github.io/apexrn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: node registry/build.mjs
      - run: npm ci
        working-directory: website
      - run: npm run check:no-rn
        working-directory: website
      - run: npm run test:scripts
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npm run typecheck
        working-directory: website
      - run: npm run build
        working-directory: website

  registry-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node registry/check-contrast.mjs
      - run: node registry/build.mjs
      - run: npm test
        working-directory: packages/cli
