appId: dev.apexrn.demo
---
- runFlow:
    file: ../_open.yaml
    env:
      ID: card
- assertVisible:
    id: "card-warning"
- scrollUntilVisible:
    element:
      id: "card-press"
    direction: DOWN
- tapOn:
    id: "card-press"
- assertVisible: "Opened: Release notes"
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: card
