appId: dev.apexrn.demo
---
- runFlow:
    file: ../_open.yaml
    env:
      ID: select
- assertVisible:
    id: "select-framework"
- tapOn:
    id: "select-framework"
- assertVisible: "Jetpack Compose"
- tapOn: "Flutter"
- assertNotVisible: "Jetpack Compose"
- assertVisible: "Last change: framework flutter"
# The searchable select sits below the fold on a phone screen.
- scrollUntilVisible:
    element:
      id: "select-country"
    direction: DOWN
- tapOn:
    id: "select-country"
- tapOn: "Search"
- inputText: "nor"
- assertNotVisible: "Brazil"
- tapOn: "Norway"
- scrollUntilVisible:
    element:
      text: "Last change: country norway"
    direction: UP
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: select
