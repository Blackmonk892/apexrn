- assertNotVisible: "Welcome back"
- tapOn:
    id: "dialog-open"
- assertVisible: "Welcome back"
- back
- assertNotVisible: "Welcome back"
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: dialog
