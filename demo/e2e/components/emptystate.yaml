appId: dev.apexrn.demo
---
- runFlow:
    file: ../_open.yaml
    env:
      ID: emptystate
- assertVisible: "Inbox zero"
- tapOn: "Compose"
- assertVisible:
    id: "emptystate-log"
    text: "Action: compose"
- tapOn: "Refresh"
- assertVisible: "Action: refresh"
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: emptystate
