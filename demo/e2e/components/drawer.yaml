appId: dev.apexrn.demo
---
- runFlow:
    file: ../_open.yaml
    env:
      ID: drawer
- assertVisible:
    id: "drawer-open"
- swipe:
    start: 1%, 50%
    end: 70%, 50%
    duration: 300
- assertVisible:
    id: "drawer-item-home"
- tapOn:
    id: "drawer-item-inbox"
# The event log sits below the fold on a phone screen.
- scrollUntilVisible:
    element:
      text: "Selected: Inbox"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "drawer-open"
    direction: UP
- tapOn:
    id: "drawer-open"
- assertVisible:
    id: "drawer-item-home"
- back
- assertNotVisible:
    id: "drawer-item-home"
- scrollUntilVisible:
    element:
      text: "Drawer: closed"
    direction: DOWN
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: drawer
