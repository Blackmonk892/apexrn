appId: dev.apexrn.demo
---
- runFlow:
    file: ../_open.yaml
    env:
      ID: appbar
- assertVisible:
    id: "appbar-log"
- assertVisible: "Last press: none"
- tapOn: "Notifications"
- assertVisible: "Last press: bell"
# The demo screen's own back button is also "Go back"; this label is the AppBar's alone.
- tapOn: "Back to mailboxes"
- assertVisible: "Last press: back"
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: appbar
