appId: dev.apexrn.demo
---
- runFlow:
    file: ../_open.yaml
    env:
      ID: skeleton
- scrollUntilVisible:
    element:
      id: "skeleton-load"
    direction: DOWN
- assertVisible:
    id: "skeleton-placeholder"
- tapOn:
    id: "skeleton-load"
- assertVisible: "Event: Loaded"
- assertVisible:
    id: "skeleton-content"
- assertNotVisible:
    id: "skeleton-placeholder"
- assertNotVisible: "Render Error"
- assertNotVisible: ".*TypeError.*"
- takeScreenshot: skeleton
